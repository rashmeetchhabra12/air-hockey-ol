name = "air-hockey"
main = "src/index.ts"
compatibility_date = "2025-07-18"

# The built client, served by this same Worker.
#
# One deployment and one origin for both halves. The alternative — static
# hosting for the page plus a separate Worker for the game — needs the client to
# be told the server's URL at build time, and needs that URL kept in sync. Here
# the page can simply open a socket back to wherever it was served from.
#
# `not_found_handling` is deliberately left at its default of "none": a request
# matching an asset is served as one, and anything else falls through to the
# fetch handler below. That fall-through is what lets /ws reach the Durable
# Object. Turning on single-page-application handling would swallow it and
# return index.html to the WebSocket upgrade instead.
[assets]
directory = "../client/dist"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "MatchRoom"

# SQLite-backed Durable Objects are the class available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]
