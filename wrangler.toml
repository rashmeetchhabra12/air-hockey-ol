# Deployment configuration, deliberately at the repository root.
#
# Cloudflare Workers Builds runs its deploy command from the root, and the
# default command is a bare `npx wrangler deploy`. A configuration nested inside
# a package is invisible to that, and the build fails with "Missing entry-point
# to Worker script or to assets directory" *after* succeeding — which reads like
# a build problem and is not one. Keeping the config here means the default
# command works and there is no dashboard setting to get right.
#
# One Worker serves both halves: the built client as static assets, and the
# authoritative game room as a Durable Object.

# Must match the Workers Builds project name, which is what the deployed Worker
# is actually called. If they differ, a local `npm run deploy` quietly creates a
# *second* Worker at a different URL instead of updating the live one.
name = "air-hockey-ol"
main = "packages/worker/src/index.ts"
compatibility_date = "2025-07-18"

# The built client.
#
# `not_found_handling` is deliberately left at its default of "none". A request
# matching a built file is served as an asset; anything else falls through to
# the fetch handler, which is how /ws reaches the Durable Object. Turning on
# single-page-application handling would swallow it and answer the WebSocket
# upgrade with index.html instead.
[assets]
directory = "packages/client/dist"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "MatchRoom"

# Matchmaking. One object holds the global queue; being single-threaded is
# precisely what makes pairing safe without a lock.
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# SQLite-backed Durable Objects are the class available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]
